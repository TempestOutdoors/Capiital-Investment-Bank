<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Motion</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--cream);color:var(--ink)}.pad{padding:56px}</style>
</head><body><div class="pad">
<div class="eyebrow">Motion</div>
<h2 style="font-family:var(--font-display);font-size:var(--text-4xl);margin:24px 0 8px">Three motions, one direction</h2>
<p style="max-width:34rem;font-weight:300;line-height:var(--leading-relaxed);color:var(--text-body)">settle for structure, veil for prose, draw for rules. Everything fires once and stays put; figures count up on entry; a 1px rule reports read progress. Nothing scales, lifts or springs.</p>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);margin-top:40px">
<div style="background:var(--cream);padding:28px"><div style="font-family:var(--font-display);font-size:var(--text-5xl)">90%</div><div style="font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--stone);margin-top:12px">Counter</div></div>
<div style="background:var(--cream);padding:28px"><div style="height:1px;background:var(--taupe)"></div><div style="font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--stone);margin-top:12px">RuleDraw</div></div>
<div style="background:var(--cream);padding:28px"><div style="font-weight:300;color:var(--text-body);line-height:var(--leading-relaxed)">Reading matter fades only.</div><div style="font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--stone);margin-top:12px">Veil</div></div>
</div>
</div><script src="../../back-to-hub.js"></script>
</body></html>
