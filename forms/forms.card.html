<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.grp{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}.cap{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-foreground);width:100%;margin-bottom:-4px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><script src="../../ds-ns.js"></script></head><body><div id="root"></div>
<script type="text/babel">const { Button, Input, Textarea, Label, Checkbox, RadioGroup, Switch, Select, Slider } = window.DS;

function Demo(){return(<div>
<div className="grp"><span className="cap">Button — variants</span>
<Button>Default</Button><Button variant="secondary">Secondary</Button><Button variant="outline">Outline</Button><Button variant="ghost">Ghost</Button><Button variant="destructive">Destructive</Button><Button variant="link">Link</Button><Button disabled>Disabled</Button></div>
<div className="grp"><span className="cap">Button — sizes &amp; editorial CTA</span>
<Button size="sm">Small</Button><Button>Default</Button><Button size="lg">Large</Button><Button variant="editorial">Our Practice →</Button></div>
<div className="grp" style={{alignItems:'flex-start'}}><span className="cap">Fields</span>
<div style={{width:200}}><Label>Email</Label><Input placeholder="partners@captal.com" style={{marginTop:6}}/></div>
<div style={{width:200}}><Label>Sector</Label><Select style={{marginTop:6}} placeholder="Select sector" options={[{value:'i',label:'Industrials'},{value:'t',label:'Technology'}]}/></div>
<div style={{width:200}}><Label>Mandate</Label><Textarea rows={2} placeholder="Nature of the mandate" style={{marginTop:6}}/></div></div>
<div className="grp"><span className="cap">Controls</span>
<Checkbox defaultChecked/><Checkbox/><Switch defaultChecked/><Switch/>
<div style={{width:140}}><Slider defaultValue={40}/></div>
<RadioGroup defaultValue="ma" options={[{value:'ma',label:'M&A'},{value:'ecm',label:'Capital Markets'}]} style={{gridAutoFlow:'column',gap:'var(--space-6)'}}/></div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);</script><script src="../../back-to-hub.js"></script>
</body></html>
